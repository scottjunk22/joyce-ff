<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past Champions — Steve Joyce Fantasy Football</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>
 :root{--bg:#0f1216;--panel:#161b22;--panel2:#1d242d;--line:#2b333d;--text:#e7eaf0;--bright:#fff;
   --dim:#9aa4b2;--blue:#4c8dff;--good:#4ade80;--warn:#fbbf24}
 @media(prefers-color-scheme:light){:root{--bg:#eef1f6;--panel:#fff;--panel2:#f0f3f8;--line:#d9e0ea;
   --text:#131922;--bright:#000;--dim:#5c6673;--blue:#1663d6}}
 *{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
 header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;text-align:center}
 h1{margin:0;font-size:18px}.hsub{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
 .wrap{max-width:640px;margin:0 auto;padding:16px}
 .reign{background:color-mix(in srgb,var(--warn) 14%,var(--panel));border:1px solid var(--warn);
   border-radius:12px;padding:14px 16px;margin-bottom:16px;text-align:center}
 .reign .yr{color:var(--warn);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
 .reign .tm{font-size:22px;font-weight:800;margin-top:2px}
 .reign .mg{color:var(--dim);font-size:13px}
 .tbl{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 table{width:100%;border-collapse:collapse}
 th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);text-align:left;
   padding:8px 13px;border-bottom:1px solid var(--line);background:var(--panel2)}
 td{padding:6px 13px;font-size:13.5px;border-top:1px solid var(--line)}
 td.yr{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
 td.tm{font-weight:700}
 td.mg{color:var(--dim)}
 .empty{padding:26px 16px;text-align:center;color:var(--dim)}
 .foot{margin:26px 0 12px;padding-top:14px;border-top:1px solid var(--line);text-align:center;color:var(--dim);font-size:12px}
 .foot a{color:var(--dim)}
</style></head><body>
<header>
  <h1>🏆 Past Champions</h1>
  <div class="hsub">Steve Joyce Fantasy Football</div>
</header>
<div class="wrap">
  {{ reign|safe }}
  <div class="tbl">{{ table|safe }}</div>
  <div class="foot"><a href="{{ home }}">← back to the league</a></div>
</div>
</body></html>
