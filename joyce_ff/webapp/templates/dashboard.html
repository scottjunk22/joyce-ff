<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steve Joyce Fantasy Football</title>
<style>
 :root{--bg:#0f1216;--panel:#161b22;--panel2:#1d242d;--line:#2b333d;--text:#e7eaf0;--bright:#ffffff;
   --dim:#9aa4b2;--blue:#4c8dff;--red:#ff5d6c;--good:#4ade80;--warn:#fbbf24;--bad:#f87171}
 @media(prefers-color-scheme:light){:root{--bg:#eef1f6;--panel:#fff;--panel2:#f0f3f8;
   --line:#d9e0ea;--text:#131922;--bright:#000000;--dim:#5c6673;--blue:#1663d6;--red:#d62b3b}}
 *{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
 header{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
 h1{margin:0;font-size:18px}.sub{color:var(--dim);font-size:12px}.spacer{margin-left:auto}
 select,input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 9px;font:inherit}
 .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
 .btn.commish{border-color:var(--warn);color:var(--warn)}
 .wrap{max-width:1120px;margin:0 auto;padding:16px}
 h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:20px 0 9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
 /* scoreboard */
 .scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
 .game{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
 .game:hover{border-color:var(--blue)}
 .game .r{display:flex;align-items:center;gap:8px;padding:3px 0}
 .game .r .nm{flex:1;font-weight:600}
 .game .r.win .nm{font-weight:800}
 .toplay{font-size:10px;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:999px;padding:1px 6px;white-space:nowrap}
 .noflag{font-size:11px;color:var(--warn);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-weight:700}
 .game .r .s{font-variant-numeric:tabular-nums;font-weight:700;min-width:26px;text-align:right}
 .game .meta{color:var(--dim);font-size:11px;margin-top:5px;border-top:1px solid var(--line);padding-top:5px;display:flex;justify-content:space-between}
 .final{color:var(--good);font-weight:700}.boxlink{color:var(--blue)}
 /* standings */
 .leagues{display:grid;grid-template-columns:1fr 1fr;gap:16px}
 .lg{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 .lg .cap{padding:9px 13px;font-weight:800}
 .lg.blue .cap{background:color-mix(in srgb,var(--blue) 22%,transparent);border-bottom:2px solid var(--blue);color:var(--blue)}
 .lg.red .cap{background:color-mix(in srgb,var(--red) 22%,transparent);border-bottom:2px solid var(--red);color:var(--red)}
 .tblwrap{overflow-x:auto}
 table{width:100%;border-collapse:collapse}
 th,td{padding:6px 8px;text-align:right;white-space:nowrap;font-size:13px;color:var(--text)}
 th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
 th{color:var(--dim);font-size:11px;font-weight:600;border-bottom:1px solid var(--line)}
 tbody tr{border-bottom:1px solid var(--line)}
 tr.playoff td:first-child{color:var(--good);font-weight:800}
 .tname{font-weight:400;cursor:pointer;color:var(--bright)}
 .tname:hover{text-decoration:underline}
 .acts{display:inline-flex;gap:4px;margin-left:8px}
 .chip{border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer}
 .chip:hover{border-color:var(--blue);color:var(--text)}
 /* elimination */
 .elim{background:color-mix(in srgb,var(--bad) 12%,transparent);border:1px solid var(--bad);border-radius:10px;padding:11px 13px;font-size:13px}
 .elim b{color:var(--bad)}
 .elim .etitle{font-size:15px;font-weight:800;color:var(--bad);margin-bottom:6px}
 .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
 .echip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:12px}
 .echip.dead{opacity:.7;border-color:var(--bad)}.echip.dead .nm{text-decoration:line-through}.echip .wk{color:var(--bad);margin-left:5px;font-size:10px}
 /* transactions */
 .txlist{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 .txlist .cap{padding:8px 13px;font-weight:800;border-bottom:2px solid var(--line)}
 .tx{padding:7px 13px;border-bottom:1px solid var(--line);font-size:13px}.tx .wk{color:var(--dim)}.tx .trade{color:var(--blue)}.tx .open{color:var(--warn)}
 /* modal */
 .mb{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}
 .mb.show{display:flex}.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:16px 18px}
 .modal h3{margin:0 0 3px}.modal .x{float:right;cursor:pointer;color:var(--dim);font-size:24px;line-height:1}
 .srow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:5px 2px;font-size:13px}.srow .slot{min-width:52px;color:var(--dim);font-weight:700;font-size:11px}.srow .nm{flex:1}.srow .pts{font-weight:700}
 .team{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:3px;font-weight:600;white-space:nowrap}
 .poschip{font-size:10px;color:var(--text);background:var(--line);border-radius:5px;padding:1px 6px;font-weight:700;white-space:nowrap}
 .st{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-left:auto;cursor:pointer}.st.start{color:var(--good);border-color:var(--good)}.st.bench{color:var(--warn);border-color:var(--warn)}
 .lban{border-radius:10px;padding:8px 11px;font-size:12.5px;margin:2px 0 10px;display:flex;gap:6px;align-items:flex-start}
 .lban.ok{border:1px solid var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
 .lban.warn{border:1px solid var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
 .lban svg{flex:none;margin-top:1px}
 .lsum{margin-bottom:12px;font-size:13px}
 .lsum .nchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
 .nchip{border:1px solid var(--bad);color:var(--bad);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
 /* box score */
 .box{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
 .boxcol{padding:0}.boxcol:first-child{border-right:1px solid var(--line)}
 .boxcol .bh{padding:8px 10px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
 .boxcol.home .bh{background:color-mix(in srgb,var(--blue) 26%,transparent)}
 .boxcol.away .bh{background:color-mix(in srgb,var(--warn) 24%,transparent)}
 .boxcol .bh.won{outline:2px solid var(--good);outline-offset:-2px}
 .boxcol .bh .tot{font-variant-numeric:tabular-nums}
 .boxcol .srow{padding:5px 10px}
 /* trade/open */
 .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}.seg button{background:var(--panel2);border:0;color:var(--text);padding:6px 14px;cursor:pointer}.seg button.on{background:var(--blue);color:#04121d;font-weight:700}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.col h4{margin:0 0 6px;font-size:12px;color:var(--dim)}
 .plist{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto}.pl{display:flex;justify-content:space-between;padding:6px 9px;border-bottom:1px solid var(--line);cursor:pointer}.pl:hover{background:var(--panel2)}.pl.sel{background:color-mix(in srgb,var(--blue) 22%,transparent)}.pl .pos{color:var(--dim);font-size:11px;min-width:52px;display:inline-block}
 .searchbox{width:100%;margin-bottom:6px}
 .explain{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;color:var(--dim);margin-top:10px}
 .pass{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 .go{background:var(--good);color:#04121d;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}
 .fees{border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}.fees .fhd{background:var(--panel2);padding:7px 12px;font-weight:700;display:flex;justify-content:space-between}.fbal{color:var(--warn);font-weight:800}.fbal.paid{color:var(--good)}.frow{display:flex;justify-content:space-between;padding:5px 12px;border-top:1px solid var(--line);font-size:13px}.frow .paid{color:var(--good);font-weight:700}
 .feetable{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}.feetable th,.feetable td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
 /* mobile */
 @media(max-width:760px){
   .leagues{grid-template-columns:1fr}.cols{grid-template-columns:1fr}
   .box{grid-template-columns:1fr}.boxcol:first-child{border-right:0;border-bottom:1px solid var(--line)}
   th,td{padding:5px 6px;font-size:12px}.acts{display:flex;margin:4px 0 0 0}
   .wrap{padding:12px}h1{font-size:16px}
 }
</style></head><body>
<header>
 <h1>🏈 Steve Joyce Fantasy Football</h1>
 <label class="sub">Week <select id="wk"></select></label>
 <span class="spacer"></span>
 <button class="btn commish" onclick="commishModal()">🛠 Commissioner</button>
 <span class="sub" id="seasonlbl"></span>
</header>
<div class="wrap">
 <h2>Scoreboard <span class="sub" style="text-transform:none;letter-spacing:0" id="upd"></span></h2>
 <div class="scores" id="scores"></div>

 <h2>Standings</h2>
 <div class="leagues">
  <div class="lg blue"><div class="cap">BLUE CONFERENCE</div><div class="tblwrap"><table><thead><tr><th>#</th><th>Team</th><th>W-L-T</th><th>Conf</th><th>PF</th><th>PA</th></tr></thead><tbody id="blue"></tbody></table></div></div>
  <div class="lg red"><div class="cap">RED CONFERENCE</div><div class="tblwrap"><table><thead><tr><th>#</th><th>Team</th><th>W-L-T</th><th>Conf</th><th>PF</th><th>PA</th></tr></thead><tbody id="red"></tbody></table></div></div>
 </div>
 <p class="sub">Click a team for its roster. Buttons: ⚙ lineup · ⇄＋ trade/open (each asks that team's passcode). <span style="color:var(--good);font-weight:700">Green</span> rank = top 8 → playoffs.</p>

 <div class="elim" id="elimBox" style="margin-top:22px"></div>

 <h2>Transactions <span class="sub" style="text-transform:none;letter-spacing:0">— $2 each</span></h2>
 <div class="leagues">
  <div class="txlist"><div class="cap" style="color:var(--blue)">BLUE</div><div id="txBlue"></div></div>
  <div class="txlist"><div class="cap" style="color:var(--red)">RED</div><div id="txRed"></div></div>
 </div>
</div>
<div class="mb" id="mb"><div class="modal"><span class="x" onclick="closeM()">×</span><div id="mbody"></div></div></div>

<script>
let STATE=null, TEAMS={}, VIEW=null, CUR=null;
const $=id=>document.getElementById(id);
const TRI='<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.24 3.96 1.82 18.02A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.98L13.66 3.96a2 2 0 0 0-3.42 0z"/></svg>';
const CHK='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M5 12l5 5L20 7"/></svg>';
async function load(week){
  const q = week!=null ? ('?week='+week) : '';
  STATE = await (await fetch('/api/state'+q)).json();
  VIEW = STATE.season.week; CUR = STATE.season.current; TEAMS={};
  for(const c of ['BLUE','RED']) STATE.standings[c].forEach(t=>TEAMS[t.team_id]=t);
  buildWeekPicker(); renderScores(); renderStandings(); renderElim(); renderTx();
  $('seasonlbl').textContent = STATE.season.label;
  const lu = STATE.season.last_updated;
  $('upd').innerHTML = '— updates as games finish' + (lu ? ' · last updated '+new Date(lu).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '');
}
function buildWeekPicker(){
  $('wk').innerHTML = STATE.season.weeks.map(w=>`<option value="${w}" ${w===VIEW?'selected':''}>${w}</option>`).join('');
  $('wk').onchange = e => load(+e.target.value);
}
function renderScores(){
  $('scores').innerHTML = STATE.scoreboard.map(g=>{
    const done = g.home.to_play===0 && g.away.to_play===0;
    const hp=g.home.points, ap=g.away.points;
    const hw=done&&hp>ap, aw=done&&ap>hp;
    const f=v=>v==null?'<span class="sub">—</span>':(+v).toFixed(0);
    const isCur = VIEW===CUR;
    const tp=t=>t.to_play>0?`<span class="toplay">${t.to_play} to play</span>`:'';
    const flag=t=>(isCur && !done && !t.lineup_set)?`<span class="noflag">${TRI} no lineup</span>`:'';
    const row=(t,win)=>`<div class="r ${win?'win':''}"><span class="nm">${t.name}</span>${flag(t)}${tp(t)}<span class="s">${f(t.points)}</span></div>`;
    return `<div class="game" onclick="boxScore(${g.home.id},${g.away.id})">${row(g.home,hw)}${row(g.away,aw)}
      <div class="meta"><span class="${done?'final':''}">${done?'Final':g.kind.toLowerCase()} · Week ${VIEW}</span><span class="boxlink">box score ›</span></div></div>`;
  }).join('') || '<span class="sub">No games this week.</span>';
}
function teamRow(t){
  return `<tr class="${t.playoffs?'playoff':''}"><td>${t.seed}</td>
    <td><span class="tname" onclick="roster(${t.team_id})">${t.name}</span>
    <span class="acts"><span class="chip" onclick="event.stopPropagation();lineupModal(${t.team_id})">⚙</span>
    <span class="chip" onclick="event.stopPropagation();txModal(${t.team_id})">⇄＋</span></span></td>
    <td>${t.wins}-${t.losses}-${t.ties}</td><td>${t.conf_wins}-${t.conf_losses}</td>
    <td>${t.pf.toFixed(0)}</td><td>${t.pa.toFixed(0)}</td></tr>`;
}
function renderStandings(){ $('blue').innerHTML=STATE.standings.BLUE.map(teamRow).join(''); $('red').innerHTML=STATE.standings.RED.map(teamRow).join(''); }
function renderElim(){
  const p=STATE.pool;
  $('elimBox').innerHTML=`<div class="etitle">💀 Elimination Pool</div>Each week the lowest scorer among survivors (both conferences) is out.
    Alive <b>${p.alive.length}</b> / 22 · Eliminated <b>${p.eliminated.length}</b>.
    <span class="sub">Wk 15: top score wins $100, other 6 survivors $10 each.</span>
    <div class="chips">${p.alive.map(t=>`<span class="echip"><span class="nm">${t.name}</span></span>`).join('')}
      ${p.eliminated.map(t=>`<span class="echip dead"><span class="nm">${t.name}</span><span class="wk">Wk ${t.eliminated_ff_week}</span></span>`).join('')}</div>`;
}
function txSide(s){ return `${s.name}${s.kind==='PLAYER'&&s.team?` <span class="team">${s.team}</span>`:''}`; }
function txSwap(t){ return `<span class="poschip">${t.pos}</span> ${txSide(t.out)} → ${txSide(t.in)}`; }
function renderTx(){ const row=t=>`<div class="tx"><span class="wk">W${t.week}</span> <span class="${t.type.toLowerCase()}">${t.type==='TRADE'?'⇄':'＋'}</span> <b>${t.team}</b> — ${txSwap(t)} <span class="sub">· $2</span></div>`;
  $('txBlue').innerHTML=STATE.transactions.BLUE.map(row).join('')||'<div class="tx sub">none</div>';
  $('txRed').innerHTML=STATE.transactions.RED.map(row).join('')||'<div class="tx sub">none</div>'; }

function openM(h){ $('mbody').innerHTML=h; $('mb').classList.add('show'); }
function closeM(){ $('mb').classList.remove('show'); }
$('mb').addEventListener('click',e=>{if(e.target===$('mb'))closeM();});

async function boxScore(homeId,awayId){
  const [h,a]=await Promise.all([fetch(`/api/team/${homeId}/detail?week=${VIEW}`).then(r=>r.json()),fetch(`/api/team/${awayId}/detail?week=${VIEW}`).then(r=>r.json())]);
  const tot=t=>t.box.reduce((s,x)=>s+(x.points||0),0);
  const th=tot(h), ta=tot(a);
  const col=(t,cls,won)=>`<div class="boxcol ${cls}"><div class="bh ${won?'won':''}"><span>${t.name}</span><span class="tot">${tot(t).toFixed(0)}</span></div>`
    +t.box.map(x=>`<div class="srow"><span class="slot">${x.roster_slot}</span><span class="nm">${x.display}${x.is_rental?' <span class="sub">(open)</span>':''}</span><span class="pts">${(x.points||0).toFixed(0)}</span></div>`).join('')+`</div>`;
  openM(`<h3>Box Score <span class="sub">· Week ${VIEW}</span></h3><div class="box" style="margin-top:8px">${col(h,'home',th>=ta&&th>0)}${col(a,'away',ta>=th&&ta>0)}</div>`);
}
async function roster(id){ const d=await (await fetch(`/api/team/${id}/detail?week=${VIEW}`)).json();
  const rows=d.roster.map(r=>`<div class="srow"><span class="slot">${r.slot}</span><span class="nm">${r.name}${r.kind==='PLAYER'&&r.team?` <span class="team">${r.team}</span>`:''}</span></div>`).join('');
  const b=c=>`$${(Math.abs(c)/100).toFixed(0)}`;
  const bal=d.fees.balance_cents;
  const balTxt = bal>0 ? `<span class="fbal">balance ${b(bal)}</span>`
    : bal<0 ? `<span class="fbal paid">credit ${b(bal)}</span>`
    : `<span class="fbal paid">settled</span>`;
  const hasFees = d.history.length||(d.payments||[]).length||d.fees.owed_cents;
  const fees = hasFees ? `<div class="fees"><div class="fhd"><span>Transaction fees</span>${balTxt}</div>`
    +d.history.map(h=>`<div class="frow"><span>W${h.week} ${h.type==='TRADE'?'⇄':'＋'} ${txSwap(h)}</span><span>${b(h.fee)}</span></div>`).join('')
    +(d.payments||[]).map(p=>`<div class="frow"><span>✓ payment${p.note?` <span class="sub">(${p.note})</span>`:''}</span><span class="paid">−${b(p.amount_cents)}</span></div>`).join('')
    +`</div>`:'';
  openM(`<h3>${d.name} — Roster</h3><div class="sub">${d.managers||''}</div><div style="margin-top:10px">${rows}</div>${fees}`);
}
let LU={team:null,sel:new Set(),items:[]};
async function lineupModal(id){
  const d=await (await fetch(`/api/team/${id}/detail?week=${CUR}`)).json();
  const items=d.roster.map(r=>({slot:r.slot,ref:r.asset_ref,name:r.name})); (d.opens||[]).forEach(o=>items.push({slot:o.position,ref:o.asset_ref,name:o.name+' (open)'}));
  LU={team:id,sel:new Set(),items};
  const started=new Set((d.box||[]).map(x=>x.asset_ref)), unit=s=>['C','K','DEF/ST','QB'].includes(s);
  if(started.size) items.forEach(i=>{if(started.has(i.ref))LU.sel.add(i.ref);});
  else{items.filter(i=>unit(i.slot)).forEach(i=>LU.sel.add(i.ref));items.filter(i=>i.slot==='RB').slice(0,2).forEach(i=>LU.sel.add(i.ref));items.filter(i=>i.slot==='R').slice(0,3).forEach(i=>LU.sel.add(i.ref));}
  const banner = started.size
    ? `<div class="lban ok">${CHK}<span>Your Week ${CUR} lineup is in. Players lock at their kickoff.</span></div>`
    : `<div class="lban warn">${TRI}<span>No lineup set for Week ${CUR} — you're currently on last week's lineup. Submit below to confirm or change it.</span></div>`;
  openM(`<h3>${d.name} — Set Lineup <span class="sub">· Week ${CUR}</span></h3>
    ${banner}
    <div class="sub">Start 9: C, K, DEF/ST, QB, 2 RB, 3 R. Players lock at their kickoff.</div>
    <div id="luRows" style="margin-top:10px"></div><div class="explain" id="luHint"></div>
    <div class="pass"><span>passcode:</span><input type="password" id="lpc" placeholder="demo"><button class="go" onclick="submitLineup()">Submit lineup</button></div>`);
  renderLineup();
}
function renderLineup(){ const ord={'C':0,'K':1,'DEF/ST':2,'QB':3,'RB':4,'R':5}, unit=s=>['C','K','DEF/ST','QB'].includes(s);
  const items=[...LU.items].sort((a,b)=>ord[a.slot]-ord[b.slot]);
  $('luRows').innerHTML=items.map(i=>{const on=LU.sel.has(i.ref);
    return `<div class="srow"><span class="slot">${i.slot}</span><span class="nm">${i.name}</span><span class="st ${on?'start':'bench'}" ${unit(i.slot)?'':`onclick="toggleStart('${i.ref}')"`}>${on?'START':'BENCH'}</span></div>`;}).join('');
  const c=s=>[...LU.sel].filter(r=>LU.items.find(i=>i.ref===r&&i.slot===s)).length;
  $('luHint').innerHTML=`Starting <b>${LU.sel.size}</b>/9 · RB ${c('RB')} · R ${c('R')} ${LU.sel.size===9?'✅':'— pick 9'}`;
}
function toggleStart(ref){ LU.sel.has(ref)?LU.sel.delete(ref):LU.sel.add(ref); renderLineup(); }
async function submitLineup(){ const starters=[...LU.sel].map(ref=>({roster_slot:LU.items.find(i=>i.ref===ref).slot,asset_ref:ref}));
  const res=await fetch(`/api/team/${LU.team}/lineup`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:$('lpc').value,week:CUR,starters})});
  const j=await res.json(); if(res.ok){alert('Lineup saved!');closeM();load(VIEW);}else alert('⚠ '+(j.error||'error')); }

let TX={team:null,out:null,outPos:null,in:null,mode:'trade',outName:'',inName:''};
async function txModal(id){ const d=await (await fetch(`/api/team/${id}/detail?week=${CUR}`)).json();
  TX={team:id,out:null,outPos:null,in:null,mode:'trade',outName:'',inName:''};
  const roster=d.roster.map(r=>`<div class="pl" onclick='pickOut("${r.asset_ref}","${r.slot}","${r.name.replace(/"/g,'')}")'><span><span class="pos">${r.slot}</span>${r.name}${r.kind==='PLAYER'&&r.team?` <span class="team">${r.team}</span>`:''}</span></div>`).join('');
  openM(`<h3>${d.name} — Move a player</h3>
   <div class="seg"><button class="on" data-m="trade" onclick="setMode('trade')">⇄ Trade (permanent)</button><button data-m="open" onclick="setMode('open')">＋ Open (1 week)</button></div>
   <div class="cols"><div><h4>Your roster — move OUT</h4><div class="plist">${roster}</div></div>
    <div><h4 id="ah">Available — pick a player first</h4><input class="searchbox" id="asearch" placeholder="search…" oninput="renderAvail(this.value)" disabled><div class="plist" id="avail"><div class="sub" style="padding:14px;text-align:center">← pick a player on the left</div></div></div></div>
   <div class="explain" id="txx"></div>
   <div class="pass"><span>passcode:</span><input type="password" id="txpc" placeholder="demo"><button class="go" onclick="submitTx()">Confirm</button></div>`);
  updateX();
}
let AVAIL=[];
async function pickOut(ref,pos,name){ TX.out=ref;TX.outPos=pos;TX.outName=name;TX.in=null;
  document.querySelectorAll('#mbody .cols .plist .pl').forEach(p=>p.classList.remove('sel')); event.currentTarget.classList.add('sel');
  $('ah').textContent=`Available ${pos} — alphabetical`; const sb=$('asearch');sb.disabled=false;sb.value='';
  AVAIL=(await (await fetch(`/api/team/${TX.team}/available?position=${encodeURIComponent(pos)}`)).json()).available; renderAvail(''); updateX(); }
function renderAvail(f){ const key=x=>x.gsis_id||x.abbr, nm=x=>x.name||x.abbr;
  const list=AVAIL.filter(x=>nm(x).toLowerCase().includes((f||'').toLowerCase()));
  $('avail').innerHTML=list.length?list.map(x=>`<div class="pl ${TX.in===key(x)?'sel':''}" onclick='pickIn("${key(x)}","${nm(x).replace(/"/g,'')}")'><span><span class="pos">${TX.outPos}</span>${nm(x)}${x.nfl_team_abbr?` <span class="team">${x.nfl_team_abbr}</span>`:''}</span></div>`).join(''):'<div class="sub" style="padding:14px;text-align:center">no matches</div>'; }
function pickIn(ref,name){ TX.in=ref;TX.inName=name;renderAvail($('asearch').value);updateX(); }
function setMode(m){ TX.mode=m;document.querySelectorAll('#mbody .seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));updateX(); }
function updateX(){ const o=TX.outName||'(your player)',i=TX.inName||'(available player)';
  $('txx').innerHTML=TX.mode==='trade'?`⇄ <b>Trade:</b> drop <b>${o}</b>, add <b>${i}</b> permanently.`:`＋ <b>Open:</b> start <b>${i}</b> for <b>${o}</b> this week only (requires ${o} on his NFL bye). ${o} stays rostered.`; }
async function submitTx(){ if(!TX.out||!TX.in){alert('Pick a player to move out and one to bring in.');return;}
  const res=await fetch(`/api/team/${TX.team}/${TX.mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:$('txpc').value,position:TX.outPos,out:TX.out,in:TX.in})});
  const j=await res.json(); if(res.ok){alert('Done! ($2 fee)');closeM();load(VIEW);}else alert('⚠ '+(j.error||'error')); }

let COMMISH_PC='';
function commishModal(){ openM(`<h3>🛠 Commissioner <span class="sub">Steve &amp; Scott</span></h3>
   <div class="pass"><span>passcode:</span><input type="password" id="cpc" placeholder="commish" value="${COMMISH_PC}"><button class="btn" onclick="commishUnlock()">Unlock</button><button class="btn" onclick="runCurrent()">▶ Score current week(s)</button></div>
   <div id="commBody"><div class="sub">Unlock to edit team #/slot/passcode and record payments.</div></div>`); }
function commishUnlock(){ COMMISH_PC=$('cpc').value; renderCommish(); }
async function apost(url,body){ body.passcode=COMMISH_PC; const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); const j=await r.json(); if(!r.ok){alert('⚠ '+(j.error||'error'));return null;} return j; }
function renderCommish(){ const teams=[...STATE.standings.BLUE,...STATE.standings.RED];
  const L=STATE.lineups;
  const lsum = L ? `<div class="lsum"><b>Lineups · Week ${L.week}:</b> <span style="color:var(--good)">${L.in}</span>/${L.total} in`
    + (L.not_in.length ? ` · <span style="color:var(--bad)">${L.not_in.length}</span> not in`
        + `<div class="nchips">${L.not_in.map(t=>`<span class="nchip">${TRI} ${t.name}</span>`).join('')}</div>`
        : ` <span class="sub">— all in ✓</span>`) + `</div>` : '';
  $('commBody').innerHTML=lsum+`<table class="feetable"><thead><tr><th>Team</th><th>#</th><th>Slot</th><th>New passcode</th><th></th><th>Owes</th><th>Payment</th></tr></thead><tbody>`
   +teams.map(t=>{const f=STATE.fees[t.team_id]||{balance_cents:0};
     return `<tr><td>${t.name}</td><td><input id="tn_${t.team_id}" style="width:40px" value="${t.team_number??''}"></td>
      <td><input id="ds_${t.team_id}" style="width:40px" value="${t.draft_slot??''}"></td>
      <td><input id="pc_${t.team_id}" style="width:80px" placeholder="—"></td>
      <td><button class="chip" onclick="saveTeam(${t.team_id})">save</button></td>
      <td>$${(f.balance_cents/100).toFixed(0)}</td>
      <td><input id="pay_${t.team_id}" style="width:38px" placeholder="$"><button class="chip" onclick="applyPay(${t.team_id})">pay</button></td></tr>`;}).join('')+`</tbody></table>`;
}
async function saveTeam(id){ const tn=$('tn_'+id).value,ds=$('ds_'+id).value,pc=$('pc_'+id).value;
  const j=await apost(`/api/admin/team/${id}`,{team_number:tn||undefined,draft_slot:ds||undefined});
  if(j&&pc) await apost(`/api/admin/team/${id}/passcode`,{new_passcode:pc}); if(j){alert('Saved');await load(VIEW);renderCommish();} }
async function applyPay(id){ const a=$('pay_'+id).value; if(!a)return; const j=await apost(`/api/team/${id}/payment`,{amount_cents:Math.round(parseFloat(a)*100),note:'commissioner'}); if(j){alert('Payment recorded');await load(VIEW);renderCommish();} }
async function runCurrent(){ const j=await apost('/api/admin/run-current',{}); if(j){alert('Scored weeks: '+(j.scored_weeks.join(', ')||'none ready'));load(VIEW);} }
load();
</script></body></html>
