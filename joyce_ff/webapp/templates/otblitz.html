<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OT Blitz — Draft Board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
<style>
 :root{--bg:#0f1216;--panel:#161b22;--panel2:#1d242d;--line:#2b333d;--text:#e7eaf0;--bright:#fff;
   --dim:#9aa4b2;--blue:#4c8dff;--good:#4ade80;--warn:#fbbf24;--bad:#f87171}
 @media(prefers-color-scheme:light){:root{--bg:#eef1f6;--panel:#fff;--panel2:#f0f3f8;--line:#d9e0ea;
   --text:#131922;--bright:#000;--dim:#5c6673;--blue:#1663d6}}
 *{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
 header{background:var(--panel);border-bottom:1px solid var(--line);padding:11px 16px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
 h1{margin:0;font-size:17px}.lock{color:var(--good)}
 .nav{display:flex;gap:6px;flex-wrap:wrap}
 .nav a{font-size:13px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:5px 11px;text-decoration:none;cursor:pointer}
 .nav a.on{color:var(--bright);border-color:var(--blue)}
 .nav a.soon{opacity:.5;cursor:default}
 .nav a .tag{font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px}
 .wrap{max-width:1080px;margin:0 auto;padding:16px}
 .gate{max-width:340px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center}
 .gate h2{margin:0 0 4px;font-size:16px}.gate p{color:var(--dim);font-size:13px;margin:0 0 14px}
 input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
 .go{background:var(--good);color:#04121d;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}
 .err{color:var(--bad);font-size:12px;min-height:16px;margin-top:8px}
 .subline{color:var(--dim);font-size:12px;margin-bottom:6px}
 .meta{color:var(--dim);font-size:12px;margin-bottom:10px;display:flex;gap:6px 16px;flex-wrap:wrap}
 .meta b{color:var(--text)}
 .toolbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
 .tab{font-size:13px;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:8px;padding:5px 12px;cursor:pointer}
 .tab.on{color:var(--bright);border-color:var(--blue)}
 .help{font-size:12px;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:8px;padding:5px 10px;cursor:pointer;margin-left:auto}
 .search{width:170px}
 .explain{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:13px;line-height:1.5}
 .explain h3{margin:0 0 4px;font-size:14px}.explain .lead{color:var(--dim);margin-bottom:9px}
 .explain dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
 .explain dt{font-weight:700;color:var(--bright);white-space:nowrap}
 .explain dd{margin:0;color:var(--dim)}
 .tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
 table{width:100%;border-collapse:collapse}
 th,td{padding:6px 9px;text-align:right;white-space:nowrap;font-size:13px}
 th{color:var(--dim);font-size:11px;font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
 th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--text)}
 th.l,td.l{text-align:left}
 tbody tr{border-bottom:1px solid var(--line)}tbody tr:last-child{border-bottom:0}
 tbody tr:hover{background:var(--panel2)}
 .vor{font-variant-numeric:tabular-nums;font-weight:800;color:var(--good)}
 .vor.lo{color:var(--dim);font-weight:600}
 .vorbar{display:inline-block;height:9px;background:color-mix(in srgb,var(--good) 55%,transparent);border-radius:2px;vertical-align:middle;margin-right:6px}
 .tier{color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px}
 tr.tierbreak td{border-top:2px solid var(--blue)}
 .postag{display:inline-block;min-width:40px;text-align:center;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;color:#04121d}
 .pt-RB{background:#4ade80}.pt-R{background:#5cc8ff}.pt-QB{background:#c084fc}.pt-K{background:#fbbf24}.pt-DEFST{background:#2dd4bf}.pt-C{background:#cbd5e1}
 .bust-lo{color:var(--good)}.bust-mid{color:var(--warn)}.bust-hi{color:var(--bad);font-weight:700}
 .nm{font-weight:600;color:var(--bright)}
 .tm{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:4px}
 .flag{font-size:10px;border-radius:5px;padding:0 5px;margin-left:5px}
 .flag.rk{color:var(--warn);border:1px solid var(--warn)}
 .flag.lo{color:var(--dim);border:1px solid var(--line)}
 .sub{color:var(--dim);font-size:12px}
 .dbar{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:10px;display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;font-size:13px}
 .dbar .pk{font-weight:800}.dbar .oc{color:var(--blue);font-weight:700}.dbar .nx{color:var(--good)}
 .dctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
 .dctl select,.dctl button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 9px;font:inherit;cursor:pointer}
 .dconf{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
 .dconf button{background:transparent;border:0;color:var(--dim);padding:5px 11px;cursor:pointer;font:inherit}
 .dconf button.on{background:var(--blue);color:#04121d;font-weight:700}
 .dgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}@media(max-width:760px){.dgrid{grid-template-columns:1fr}}
 .dlist{border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:70vh;overflow-y:auto}
 .drow{display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line);font-size:13px}.drow:last-child{border-bottom:0}
 .draftbtn{font-size:11px;border:1px solid var(--good);color:var(--good);background:transparent;border-radius:6px;padding:2px 9px;cursor:pointer;white-space:nowrap}
 .draftbtn:hover{background:color-mix(in srgb,var(--good) 14%,transparent)}
 .dros{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
 .dros .cap{background:var(--panel2);padding:6px 10px;font-weight:800;font-size:13px}
 .drr{display:flex;justify-content:space-between;padding:4px 10px;border-top:1px solid var(--line);font-size:12px}
 .drr .slot{color:var(--dim);font-weight:700;font-size:10px;min-width:48px}.drr .empty{color:#5f6b7a}
 .dmini{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:5px}
 .dmt{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;cursor:pointer}
 .dmt.me{border-color:var(--good)}.dmt.oc{border-color:var(--blue)}.dmt .f{color:var(--dim);font-variant-numeric:tabular-nums}
 .clk{display:inline-flex;gap:4px;margin-right:6px}
 .clk button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:1px 8px;cursor:pointer;font:inherit;line-height:1.3}
 .clk button:hover{border-color:var(--blue)}
 .drr .rv{display:flex;align-items:center;gap:6px}
 .rmbtn{border:0;background:transparent;color:#8a97a6;cursor:pointer;font-size:12px;line-height:1;padding:0 2px}
 .rmbtn:hover{color:#e0736f}
 .dhint{background:color-mix(in srgb,var(--blue) 12%,var(--panel));border:1px solid var(--line);border-radius:8px;padding:6px 11px;margin-bottom:10px;font-size:12.5px}
 .dord{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px}
 .dord h4{margin:0 0 2px;font-size:13px}
 .dordgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin:9px 0}
 .dordrow{display:flex;align-items:center;gap:7px;font-size:12.5px}
 .dordrow .tnm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .dordrow select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:3px 5px;font:inherit}
 .dordrow select.unset{border-color:var(--warn);color:var(--warn)}
 .nwrap{padding:3px 0}
 .nrow{display:flex;align-items:center;gap:7px;padding:3px 10px;font-size:12px}
 .nrow.need{background:color-mix(in srgb,var(--good) 8%,transparent)}
 .nbar{flex:1;min-width:34px;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
 .nbar span{display:block;height:100%;background:var(--blue);border-radius:4px}
 .nnum{min-width:18px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
 .nteams{min-width:38px;color:var(--dim);font-variant-numeric:tabular-nums}
 .nme{min-width:38px;color:var(--good);font-size:11px}
 .ntag{min-width:30px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
 .ntag.hot{color:var(--warn);font-weight:700}.ntag.cold{color:var(--dim)}
 .nread{border-top:1px solid var(--line);padding:6px 10px;font-size:12px;line-height:1.5}
</style></head><body>
<header>
 <h1>🔒 <span class="lock">OT Blitz</span> <span class="sub">— private</span></h1>
 <nav class="nav">
   <a id="navBoard" class="on" onclick="setSection('board')">Valuation Board</a>
   <a id="navDraft" onclick="setSection('draft')">Draft Room</a>
   <a class="soon">In-season Advisor <span class="tag">soon</span></a>
 </nav>
</header>

<div class="wrap">
 <div class="gate" id="gate" style="display:none">
   <h2>🔒 Private</h2>
   <p>OT Blitz draft board. Enter the platform passcode.</p>
   <div><input type="password" id="pc" placeholder="passcode" onkeydown="if(event.key==='Enter')unlock()"> <button class="go" onclick="unlock()">Unlock</button></div>
   <div class="err" id="gerr"></div>
 </div>
 <div id="board" style="display:none"></div>
</div>

<script>
let BOARD=null, tab='overall', q='', sortCol='vor', sortDir=-1, showHelp=false;
let SECTION='board', DRAFT=null, DCONF='BLUE', DASSIGN=null, dtab='overall', dq='', DORDER=false;
const $=id=>document.getElementById(id);
const getPC=()=>sessionStorage.getItem('otbpc')||'';
const SLOT_TABS=[['overall','★ Overall'],['RB','RB'],['R','R (WR/TE)'],['QB','QB units'],['K','Kickers'],['DEF/ST','DEF/ST'],['C','Coaches']];
const UNIT_TABS=new Set(['QB','K','DEF/ST','C']);
const TIP={rank:'Strict rank by the current sort (no ties)',tier:'Value groups between cliffs — same tier ≈ interchangeable',
  slot:'Roster slot / asset type',name:'Asset name; flags mark thin or missing history',team:'NFL team',
  proj:"Projected points per game in this league's threshold scoring",vor:'Value Over Replacement — pts/game above a freely-available player',
  floor:'A typical bad week (25th percentile)',ceil:'A typical good week (75th percentile)',
  bust:'Share of games that scored a flat zero',games25:'Games played in 2025 (sample size / recency)'};

async function fetchBoard(pc){
  const r=await fetch('/api/otblitz/board?pc='+encodeURIComponent(pc));
  if(r.status===403) return 'locked';
  if(!r.ok){ const j=await r.json().catch(()=>({})); return j.error||'error'; }
  return await r.json();
}
async function unlock(){
  const pc=$('pc').value;
  const res=await fetchBoard(pc);
  if(res==='locked'){ $('gerr').textContent='Wrong passcode.'; return; }
  if(typeof res==='string'){ $('gerr').textContent=res; return; }
  sessionStorage.setItem('otbpc',pc); BOARD=res; showBoard();
}
async function init(){
  const saved=sessionStorage.getItem('otbpc');
  if(saved){ const res=await fetchBoard(saved); if(res&&typeof res!=='string'){ BOARD=res; showBoard(); return; } }
  $('gate').style.display='block';
}
function showBoard(){ $('gate').style.display='none'; $('board').style.display='block'; paint(); }
function updateNav(){ $('navBoard').className=SECTION==='board'?'on':''; $('navDraft').className=SECTION==='draft'?'on':''; }
function paint(){ updateNav(); if(SECTION==='draft'){ if(!DRAFT){ loadDraft(); return; } renderDraft(); } else render(); }
function setSection(s){ if(SECTION===s) return; SECTION=s; if(s==='draft'&&!DRAFT){ updateNav(); loadDraft(); } else paint(); }

function rows(){
  if(tab==='overall') return BOARD.overall;
  if(UNIT_TABS.has(tab)) return (BOARD.units[tab]||[]);
  return BOARD.players.filter(p=>p.slot===tab);
}
function sortRows(list){
  return [...list].sort((a,b)=>{
    let av=a[sortCol], bv=b[sortCol];
    if(av==null&&bv==null) return 0; if(av==null) return 1; if(bv==null) return -1;
    if(typeof av==='string') return sortDir*av.localeCompare(bv);
    return sortDir*(av-bv);
  });
}
function clickSort(col){ if(sortCol===col) sortDir=-sortDir; else { sortCol=col; sortDir=(col==='name'||col==='team'||col==='slot')?1:-1; } render(); }
function fmt(v){ return v==null?'<span class="sub">—</span>':(+v).toFixed(2); }
function ptClass(slot){ return 'pt-'+String(slot).replace('/',''); }
function bustClass(b){ return b==null?'':b<20?'bust-lo':b<33?'bust-mid':'bust-hi'; }
function maxVor(list){ let m=0; for(const r of list){ if(r.vor!=null&&r.vor>m)m=r.vor; } return m||1; }
function vorCell(v,mx){ const w=v==null?0:Math.max(0,(v/mx)*70), lo=(v==null||v<0.3);
  return `<td><span class="vorbar" style="width:${w}px"></span><span class="vor ${lo?'lo':''}">${v==null?'—':(v>0?'+':'')+v.toFixed(2)}</span></td>`; }
function bustCell(b){ return `<td class="${bustClass(b)}">${b==null?'<span class="sub">—</span>':b+'%'}</td>`; }

function explainer(){
  return `<div class="explain"><h3>How to read the board</h3>
    <div class="lead">All numbers are <b>per game</b>, in this league's threshold scoring — a 74-yard, no-TD game counts as 0. Hover any column header for the short version.</div>
    <dl>
     <dt>Tier</dt><dd>Value groups between cliffs. Same tier ≈ interchangeable; a tier drop is a real drop-off worth drafting ahead of.</dd>
     <dt>Proj/g</dt><dd>Every real game (2023–25, recent seasons weighted heavier) scored with the engine and averaged — threshold-aware, so weak games count as 0. Shrunk toward replacement when the sample is thin.</dd>
     <dt>VOR</dt><dd>Value over replacement — pts/game above a freely-available player at the same slot (≈ the 33rd RB / 44th receiver in your 11-team division; the 12th team for units). The real draft currency — it compares an RB vs a kicker vs a QB room on one scale.</dd>
     <dt>Floor / Ceil</dt><dd>A typical bad week (25th pct) and good week (75th pct). Their width shows consistency — tight = steady, wide = boom-bust.</dd>
     <dt>Bust%</dt><dd>Share of games that scored a flat 0. Under threshold scoring, zeros are common — a high bust% is a real cost even if the average looks fine.</dd>
     <dt>G25</dt><dd>Games played in 2025 — sample size / recency. G25=17 is a full season; a big projection on G25=2 is thin (shrunk and flagged, never chased).</dd>
    </dl></div>`;
}
function render(){
  const L=BOARD.league, W='2025×1.0 · 2024×0.6 · 2023×0.35', repl=BOARD.replacement||{};
  const nPlayers=(BOARD.players||[]).length;
  const meta=`<div class="subline">Draft ${BOARD.draft_season} · ${nPlayers} players + team units · built ${new Date(BOARD.generated_at).toLocaleString([], {month:'short',day:'numeric',year:'numeric'})}</div>
    <div class="meta">
      <span>Seasons weighted <b>${W}</b></span>
      <span>Scarcity <b>${L.division_teams}-team division</b> (${L.rostered_rb} RB / ${L.rostered_r} R rostered)</span>
      <span>Replacement: RB <b>${fmt(repl.RB)}</b> · R <b>${fmt(repl.R)}</b></span>
    </div>`;
  const toolbar=`<div class="toolbar">${SLOT_TABS.map(([k,lbl])=>`<span class="tab ${tab===k?'on':''}" onclick="setTab('${k}')">${lbl}</span>`).join('')}
    <button class="help" onclick="toggleHelp()">❔ ${showHelp?'hide':'how to read'}</button>
    <input class="search" id="q" placeholder="search…" value="${q}" oninput="setQ(this.value)"></div>`;
  $('board').innerHTML=meta+toolbar+(showHelp?explainer():'')+`<div class="tblwrap" id="tbl">${UNIT_TABS.has(tab)?unitTable():playerTable()}</div>`;
}
function setTab(t){ tab=t; render(); if($('q'))$('q').focus(); }
function setQ(v){ q=v; const w=$('tbl'); if(w)w.innerHTML=UNIT_TABS.has(tab)?unitTable():playerTable(); }
function toggleHelp(){ showHelp=!showHelp; render(); }
function th(field,label,cls){ const arw=sortCol===field?(sortDir<0?' ▼':' ▲'):''; return `<th class="sortable ${cls||''}" title="${TIP[field]||''}" onclick="clickSort('${field}')">${label}${arw}</th>`; }

function playerTable(){
  const isOverall=tab==='overall';
  let list=sortRows(rows()); if(q) list=list.filter(r=>r.name.toLowerCase().includes(q.toLowerCase()));
  const mx=maxVor(list), tierGroup=(sortCol==='vor'); let prev=null;
  const head=`<tr><th title="${TIP.rank}">#</th>${th('tier','Tier')}${isOverall?th('slot','Pos','l'):''}${th('name','Asset','l')}<th class="l">Tm</th>${th('proj','Proj/g')}${th('vor','VOR')}${th('floor','Flr')}${th('ceil','Ceil')}${th('bust','Bust%')}${th('games25','G25')}</tr>`;
  const body=list.map((r,i)=>{
    const brk=(tierGroup&&prev!=null&&r.tier!=null&&r.tier!==prev)?' tierbreak':''; prev=r.tier;
    const flags=(r.no_history?'<span class="flag rk">no NFL history</span>':'')+(r.low_sample&&!r.no_history?'<span class="flag lo">small sample</span>':'');
    return `<tr class="${brk}"><td>${i+1}</td><td><span class="tier">T${r.tier??'—'}</span></td>
      ${isOverall?`<td class="l"><span class="postag ${ptClass(r.slot)}">${r.slot}</span></td>`:''}
      <td class="l"><span class="nm">${r.name}</span>${flags}</td>
      <td class="l">${r.team?`<span class="tm">${r.team}</span>`:'<span class="sub">—</span>'}</td>
      <td>${fmt(r.proj)}</td>${vorCell(r.vor,mx)}<td>${fmt(r.floor)}</td><td>${fmt(r.ceil)}</td>
      ${bustCell(r.bust)}<td>${r.games25??0}</td></tr>`;
  }).join('')||'<tr><td class="l sub" colspan="10" style="padding:14px">no matches</td></tr>';
  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function unitTable(){
  let list=sortRows(rows()); if(q) list=list.filter(r=>r.team.toLowerCase().includes(q.toLowerCase()));
  const mx=maxVor(list);
  const head=`<tr><th title="${TIP.rank}">#</th>${th('team','Team unit','l')}${th('proj','Proj/g')}${th('vor','VOR')}${th('floor','Flr')}${th('ceil','Ceil')}${th('bust','Bust%')}${th('games25','G25')}</tr>`;
  const body=list.map((r,i)=>{
    return `<tr><td>${i+1}</td><td class="l"><span class="postag ${ptClass(tab)}">${r.team}</span></td>
      <td>${fmt(r.proj)}</td>${vorCell(r.vor,mx)}<td>${fmt(r.floor)}</td><td>${fmt(r.ceil)}</td>
      ${bustCell(r.bust)}<td>${r.games25??0}</td></tr>`;}).join('');
  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

/* ---------- Draft Room ---------- */
const DSLOT_MAX={C:1,K:1,'DEF/ST':1,QB:1,RB:3,R:4};
const ROSTER_ROWS=[['C','C'],['K','K'],['DEF/ST','DEF/ST'],['QB','QB'],['RB','RB'],['RB','RB'],['RB','RB'],['R','R'],['R','R'],['R','R'],['R','R']];

async function draftFetch(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({passcode:getPC(),...body})});
  const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j;
}
async function loadDraft(){
  const r=await fetch(`/api/otblitz/draft?pc=${encodeURIComponent(getPC())}&conf=${DCONF}`);
  if(!r.ok){ $('board').innerHTML=`<div class="explain">Could not load draft (${r.status}).</div>`; return; }
  DRAFT=await r.json(); renderDraft();
}
function setDConf(c){ if(DCONF===c)return; DCONF=c; DASSIGN=null; DRAFT=null; DORDER=false; loadDraft(); }
function setAssign(v){ DASSIGN=(v==='clock'||v==null)?null:+v; renderDraft(); }
function setDTab(k){ dtab=k; renderDraft(); if($('dq'))$('dq').focus(); }
function setDQ(v){ dq=v; const el=document.querySelector('.dlist'); if(el)el.innerHTML=draftList(); }

function rowAssetFor(r){
  if(UNIT_TABS.has(dtab)) return {kind:'TEAM_UNIT',ref:r.team,slot:dtab};
  if(dtab==='overall'&&r.id==null) return {kind:'TEAM_UNIT',ref:r.team,slot:r.position};
  return {kind:'PLAYER',ref:r.id,slot:r.slot};
}
function draftList(){
  const D=DRAFT, dp=new Set(D.drafted_players), du=new Set(D.drafted_units);
  let rws;
  if(dtab==='overall') rws=BOARD.overall.filter(r=> r.id? !dp.has(r.id) : !du.has(`${r.team}|${r.position}`));
  else if(UNIT_TABS.has(dtab)) rws=(BOARD.units[dtab]||[]).filter(r=>!du.has(`${r.team}|${dtab}`))
        .map(r=>({...r,slot:dtab,position:dtab,name:`${r.team} ${dtab}`,id:null}));
  else rws=BOARD.players.filter(r=>r.slot===dtab && !dp.has(r.id));
  if(dq){ const s=dq.toLowerCase(); rws=rws.filter(r=>(r.name||'').toLowerCase().includes(s)||(r.team||'').toLowerCase().includes(s)); }
  rws=rws.slice(0,80);
  if(!rws.length) return '<div class="drow"><span class="sub">none available</span></div>';
  return rws.map(r=>{
    const a=rowAssetFor(r), v=r.vor;
    return `<div class="drow"><span class="tier">T${r.tier??'—'}</span>`
      +`<span class="postag ${ptClass(a.slot)}">${a.slot}</span>`
      +`<span style="flex:1;min-width:0"><span class="nm">${r.name}</span>`
      +(a.kind==='PLAYER'&&r.team?` <span class="tm">${r.team}</span>`:'')+`</span>`
      +`<span class="vor ${v==null||v<0.3?'lo':''}">${v==null?'—':(v>0?'+':'')+(+v).toFixed(2)}</span>`
      +`<button class="draftbtn" onclick="draftPick('${a.kind}','${a.ref}','${a.slot}')">${DASSIGN==null?'draft →':'add →'}</button></div>`;
  }).join('');
}
function rosterPanel(t){
  const used={C:0,K:0,'DEF/ST':0,QB:0,RB:0,R:0};
  const n=Object.values(t.roster).reduce((a,x)=>a+x.length,0);
  const rows=ROSTER_ROWS.map(([slot,lbl])=>{
    const arr=t.roster[slot]||[], v=arr[used[slot]++];
    const val=v?`<span class="nm">${v.name}</span><button class="rmbtn" title="remove (does not move the clock)" onclick="removePick(${v.id})">✕</button>`
              :'<span class="empty">—</span>';
    return `<div class="drr"><span class="slot">${lbl}</span><span class="rv">${val}</span></div>`;
  }).join('');
  return `<div class="dros"><div class="cap">${t.name} · ${n}/11</div>${rows}</div>`;
}
async function draftPick(kind,ref,slot){
  const follow=(DASSIGN==null);                 // ▶ on-the-clock mode advances the clock
  const team=DASSIGN||(DRAFT&&DRAFT.on_clock_team);
  if(!team){ alert('No team on the clock (draft slots may be unset). Pick a team to assign to first.'); return; }
  try{ await draftFetch('/api/otblitz/draft/pick',{team_id:team,kind,ref,slot,advance:follow,conf:DCONF}); }
  catch(e){ alert('⚠ '+e.message); return; }
  await loadDraft();
}
async function removePick(entryId){
  try{ await draftFetch('/api/otblitz/draft/remove',{conf:DCONF,entry_id:entryId}); }
  catch(e){ alert('⚠ '+e.message); return; }
  await loadDraft();
}
/* League Needs — remaining DEMAND per slot across the conference. The pools of
   players/units are deep; what actually moves a draft is how many rosters still
   have a hole at each slot. Counts only, no behavioural prediction. */
function needsRows(){
  const D=DRAFT, me=D.teams.find(t=>t.id===D.otb_team);
  return ['C','K','DEF/ST','QB','RB','R'].map(slot=>{
    const max=DSLOT_MAX[slot];
    let teams=0, open=0;
    for(const t of D.teams){
      const gap=Math.max(0,max-((t.roster[slot]||[]).length));
      if(gap>0) teams++;
      open+=gap;
    }
    return {slot, teams, open, mine: me?Math.max(0,max-((me.roster[slot]||[]).length)):null};
  });
}
function needsPanel(){
  const rows=needsRows().sort((a,b)=>b.open-a.open||b.teams-a.teams);
  const mx=Math.max(1,...rows.map(r=>r.open));
  const nTeams=DRAFT.teams.length;
  const body=rows.map(r=>{
    const done=r.open===0, hot=!done&&r.teams>=nTeams*0.6, cold=!done&&r.teams<=nTeams*0.28;
    const cls=r.mine>0?'need':'';
    return `<div class="nrow ${cls}"><span class="postag ${ptClass(r.slot)}">${r.slot}</span>`
      +`<span class="nbar"><span style="width:${(r.open/mx)*100}%"></span></span>`
      +`<span class="nnum" title="roster holes left league-wide">${r.open}</span>`
      +`<span class="nteams" title="teams still needing one">${r.teams} tm</span>`
      +`<span class="nme">${r.mine==null?'':r.mine>0?'you '+r.mine:'✓'}</span>`
      +`<span class="ntag ${hot?'hot':'cold'}">${done?'done':hot?'high':cold?'thin':'—'}</span></div>`;
  }).join('');
  return `<div class="dros"><div class="cap">League needs <span class="sub">— openings left in ${DCONF==='BLUE'?'Blue':'Red'}</span></div>`
    +`<div class="nwrap">${body}</div>${needsRead()}</div>`;
}
function needsRead(){
  const rows=needsRows(), mine=rows.filter(r=>r.mine>0);
  if(!DRAFT.otb_team) return `<div class="nread sub">OT Blitz doesn't draft in this conference — showing league demand only.</div>`;
  if(!mine.length) return `<div class="nread">✓ Your roster is full.</div>`;
  const by=[...mine].sort((a,b)=>b.teams-a.teams);
  const top=by[0], low=by[by.length-1];
  const need=mine.map(r=>r.mine>1?`${r.slot}×${r.mine}`:r.slot).join(', ');
  let msg=`You still need <b>${need}</b>.`;
  if(by.length>1 && top.teams>low.teams)
    msg+=` <b>${top.slot}</b> is the contested one (${top.teams} of ${DRAFT.teams.length} teams still need one) — take it earlier;`
       +` only ${low.teams} team${low.teams===1?'':'s'} still need${low.teams===1?'s':''} a <b>${low.slot}</b>, so that one can wait.`;
  return `<div class="nread">${msg}</div>`;
}
function orderPanel(){
  const D=DRAFT, n=D.teams.length;
  const anyUnset=D.teams.some(t=>t.draft_slot==null);
  if(!DORDER && !anyUnset) return `<div class="dord"><h4>Draft order <span class="sub">— set</span> `
    +`<button class="draftbtn" style="border-color:var(--line);color:var(--dim)" onclick="toggleOrder()">edit</button></h4>`
    +`<div class="sub">${[...D.teams].sort((a,b)=>(a.draft_slot??99)-(b.draft_slot??99)).map(t=>`${t.draft_slot}. ${t.name}`).join(' · ')}</div></div>`;
  const rows=[...D.teams].sort((a,b)=>(a.draft_slot??99)-(b.draft_slot??99)).map(t=>
    `<div class="dordrow"><span class="tnm">${t.name}</span>`
    +`<select class="${t.draft_slot==null?'unset':''}" id="slot_${t.id}">`
    +`<option value="">—</option>`
    +Array.from({length:n},(_,i)=>i+1).map(s=>`<option value="${s}" ${t.draft_slot===s?'selected':''}>${s}</option>`).join('')
    +`</select></div>`).join('');
  return `<div class="dord"><h4>Draft order — ${DCONF==='BLUE'?'Blue':'Red'} conference</h4>`
    +`<div class="sub">Enter each manager's slot draw (1–${n}). Team names come from the commissioner tab.</div>`
    +`<div class="dordgrid">${rows}</div>`
    +`<button class="draftbtn" onclick="saveOrder()">Save draft order</button> `
    +`<button class="draftbtn" style="border-color:var(--line);color:var(--dim)" onclick="toggleOrder()">cancel</button></div>`;
}
function toggleOrder(){ DORDER=!DORDER; renderDraft(); }
async function saveOrder(){
  const slots={};
  for(const t of DRAFT.teams){ const v=$('slot_'+t.id).value; if(v) slots[t.id]=+v; }
  const seen=new Set(); for(const v of Object.values(slots)){ if(seen.has(v)){ alert('⚠ Two teams have slot '+v+'. Each slot 1–'+DRAFT.teams.length+' can only be used once.'); return; } seen.add(v); }
  const picks=DRAFT.pick-1;
  if(picks>0 && !confirm(`${picks} pick(s) have already been made in this conference.\n\nChanging the draft order now re-derives who is on the clock. Continue?`)) return;
  try{ await draftFetch('/api/otblitz/draft/slots',{conf:DCONF,slots}); }
  catch(e){ alert('⚠ '+e.message); return; }
  DORDER=false; await loadDraft();
}
async function nudgeClock(delta){
  if(!DRAFT) return;
  const pick=Math.max(1,Math.min(DRAFT.total_picks+1,DRAFT.pick+delta));
  if(pick===DRAFT.pick) return;
  try{ await draftFetch('/api/otblitz/draft/clock',{conf:DCONF,pick}); }
  catch(e){ alert('⚠ '+e.message); return; }
  await loadDraft();
}
async function undoPick(){
  if(!confirm('Undo the last pick in the '+DCONF+' draft?')) return;
  try{ const j=await draftFetch('/api/otblitz/draft/undo',{conf:DCONF}); if(!j.undone) alert('Nothing to undo.'); }
  catch(e){ alert('⚠ '+e.message); return; }
  await loadDraft();
}
async function resetDraft(){
  if(!confirm('RESET the entire '+DCONF+' draft? This deletes every drafted pick in this conference.')) return;
  if(!confirm('Are you sure? This cannot be undone.')) return;
  try{ await draftFetch('/api/otblitz/draft/reset',{conf:DCONF}); }
  catch(e){ alert('⚠ '+e.message); return; }
  DASSIGN=null; await loadDraft();
}
function renderDraft(){
  const D=DRAFT; if(!D){ $('board').innerHTML='<div class="explain">Loading draft…</div>'; return; }
  const done=D.pick>D.total_picks;
  const oc=D.teams.find(t=>t.id===D.on_clock_team);
  const assign=DASSIGN||D.on_clock_team;
  const at=D.teams.find(t=>t.id===assign);
  const arrows=`<span class="clk"><button onclick="nudgeClock(-1)" title="move the clock back one pick">◀</button>`
    +`<button onclick="nudgeClock(1)" title="move the clock forward one pick">▶</button></span>`;
  const bar=`<div class="dbar">${arrows}`
    +(done?`<span class="pk">✔ Draft complete — ${D.total_picks} picks</span>`
          :`<span class="pk">Pick ${D.pick} · Round ${D.round}/${Math.ceil(D.total_picks/D.teams.length)}</span>`
           +` · <span class="oc">${oc?oc.name:'— (no slot set)'} on the clock</span>`)
    +(D.otb_next?` · <span class="nx">OT Blitz next: pick ${D.otb_next}${D.otb_next>D.pick?` (in ${D.otb_next-D.pick})`:' — now!'}</span>`:'')
    +`</div>`;
  const conf=`<div class="dconf"><button class="${DCONF==='BLUE'?'on':''}" onclick="setDConf('BLUE')">Blue</button>`
    +`<button class="${DCONF==='RED'?'on':''}" onclick="setDConf('RED')">Red</button></div>`;
  const opts=`<option value="clock" ${DASSIGN==null?'selected':''}>▶ On the clock${oc?' ('+oc.name+')':''}</option>`
    +D.teams.map(t=>`<option value="${t.id}" ${DASSIGN===t.id?'selected':''}>${t.name}</option>`).join('');
  const ctl=`<div class="dctl">${conf}<span class="sub">assign pick to:</span>`
    +`<select onchange="setAssign(this.value)">${opts}</select>`
    +`<button onclick="undoPick()">↶ Undo</button>`
    +`<button onclick="resetDraft()" style="border-color:#c0433f;color:#e0736f">Reset</button></div>`;
  const hint=DASSIGN!=null
    ? `<div class="dhint">✋ <b>Manual add</b> — the next “add →” goes to <b>${at?at.name:'—'}</b> and <b>won’t move the clock</b> (stays on ${oc?oc.name:'—'}). Pick “▶ On the clock” to resume normal drafting.</div>`
    : '';
  const tabs=`<div class="toolbar" style="margin-bottom:8px">`
    +SLOT_TABS.map(([k,lbl])=>`<span class="tab ${dtab===k?'on':''}" onclick="setDTab('${k}')">${lbl}</span>`).join('')
    +`<input class="search" id="dq" placeholder="search…" value="${dq}" oninput="setDQ(this.value)"></div>`;
  const mini=`<div class="dmini">`+D.teams.map(t=>{
    const n=Object.values(t.roster).reduce((a,x)=>a+x.length,0);
    return `<div class="dmt ${t.id===D.otb_team?'me':''} ${t.id===D.on_clock_team?'oc':''}" onclick="setAssign('${t.id}')"><b>${t.name}</b> <span class="f">${n}/11</span></div>`;
  }).join('')+`</div>`;
  $('board').innerHTML=bar+ctl+orderPanel()+hint+`<div class="dgrid"><div>${tabs}<div class="dlist">${draftList()}</div></div>`
    +`<div>${needsPanel()}${at?rosterPanel(at):''}${mini}</div></div>`;
}

init();
</script>
</body></html>
