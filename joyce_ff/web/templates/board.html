<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyce FF — Draft Board</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e242c; --line:#2a323c;
    --text:#e6e9ee; --dim:#9aa4b2; --accent:#5cc8ff; --good:#4ade80;
    --warn:#fbbf24; --bad:#f87171; --bar:#2b6cb0;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f9; --panel:#fff; --panel2:#eef2f7; --line:#d7dee7;
      --text:#141a21; --dim:#5a6673; --accent:#0a6ebd; --bar:#9fc3e8; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:5;background:var(--panel);
    border-bottom:1px solid var(--line);padding:10px 16px}
  h1{margin:0;font-size:16px;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:12px;margin-top:2px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .tab{padding:6px 12px;border:1px solid var(--line);border-radius:999px;
    background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px}
  .tab.active{background:var(--accent);color:#04121d;border-color:var(--accent);font-weight:600}
  input[type=search]{margin-left:auto;padding:6px 10px;border:1px solid var(--line);
    border-radius:6px;background:var(--panel2);color:var(--text);min-width:180px}
  .wrap{padding:12px 16px;max-width:1100px;margin:0 auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:5px 8px;text-align:right;white-space:nowrap}
  th:nth-child(3),td:nth-child(3){text-align:left}
  th{position:sticky;top:96px;background:var(--panel);border-bottom:1px solid var(--line);
    cursor:pointer;color:var(--dim);font-weight:600;font-size:12px;user-select:none}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr:hover{background:var(--panel2)}
  tr.tierbreak td{border-top:2px solid var(--accent)}
  .name{font-weight:600}
  .muted{color:var(--dim)}
  .flag{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:6px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .flag.nohist{color:var(--warn);border-color:var(--warn)}
  .vorbar{display:inline-block;height:9px;background:var(--bar);border-radius:2px;
    vertical-align:middle;margin-right:6px}
  .tierpill{display:inline-block;min-width:20px;text-align:center;border-radius:4px;
    background:var(--panel2);border:1px solid var(--line);padding:0 4px;font-size:12px}
  .bust-lo{color:var(--good)} .bust-mid{color:var(--warn)} .bust-hi{color:var(--bad)}
  footer{color:var(--dim);font-size:12px;padding:10px 16px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>🏈 Joyce Fantasy Football — Draft Board</h1>
  <div class="sub" id="sub"></div>
  <div class="controls" id="tabs"></div>
</header>
<div class="wrap">
  <table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>
<footer id="foot"></footer>

<script>
const DATA = __BOARD_DATA__;
let view = "RB", query = "", sortKey = "vor", sortDir = -1;

const PLAYER_COLS = [
  ["rank","#"],["tier","Tier"],["name","Player"],["team","Tm"],["position","Pos"],
  ["proj","Proj/g"],["vor","VOR"],["floor","Floor"],["ceil","Ceil"],
  ["bust","Bust%"],["games25","G25"]
];
const UNIT_COLS = [
  ["rank","#"],["team","Team"],["proj","Proj/g"],["vor","VOR"],
  ["floor","Floor"],["ceil","Ceil"],["games25","G25"]
];
const UNIT_VIEWS = {QB:"QB unit", K:"Kicker", "DEF/ST":"DEF/ST", C:"Coach"};

function isUnit(v){ return v in UNIT_VIEWS; }
function rows(){
  let r = isUnit(view) ? DATA.units[view] : DATA.players.filter(p=>p.slot===view);
  if(query){ const q=query.toLowerCase();
    r = r.filter(x => (x.name||x.team||"").toLowerCase().includes(q)
                   || (x.team||"").toLowerCase().includes(q)); }
  r = r.slice().sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(av==null) return 1; if(bv==null) return -1;
    if(typeof av==="string") return sortDir*av.localeCompare(bv);
    return sortDir*(av-bv);
  });
  return r;
}
function fmt(v){ return v==null? '<span class="muted">—</span>' : v; }
function bustClass(b){ return b==null?'':b<20?'bust-lo':b<33?'bust-mid':'bust-hi'; }

function render(){
  const cols = isUnit(view)?UNIT_COLS:PLAYER_COLS;
  document.getElementById("thead").innerHTML =
    "<tr>"+cols.map(c=>`<th data-k="${c[0]}">${c[1]}${sortKey===c[0]?(sortDir<0?" ▼":" ▲"):""}</th>`).join("")+"</tr>";
  const maxVor = Math.max(1, ...rows().map(r=>r.vor||0));
  let prevTier=null, html="";
  for(const r of rows()){
    const br = (!isUnit(view) && r.tier!=null && prevTier!=null && r.tier!==prevTier) ? " tierbreak":"";
    prevTier = r.tier;
    const cells = cols.map(([k])=>{
      if(k==="name"){
        let f="";
        if(r.no_history) f='<span class="flag nohist">no history</span>';
        else if(r.low_sample) f='<span class="flag">low sample</span>';
        return `<td class="name">${r.name}${f}</td>`;
      }
      if(k==="tier") return `<td><span class="tierpill">${r.tier??"—"}</span></td>`;
      if(k==="vor"){
        const w = r.vor==null?0:Math.max(0,(r.vor/maxVor)*70);
        return `<td><span class="vorbar" style="width:${w}px"></span>${fmt(r.vor)}</td>`;
      }
      if(k==="bust") return `<td class="${bustClass(r.bust)}">${r.bust==null?'—':r.bust+'%'}</td>`;
      return `<td>${fmt(r[k])}</td>`;
    }).join("");
    html += `<tr class="${br}">${cells}</tr>`;
  }
  document.getElementById("tbody").innerHTML = html ||
    `<tr><td colspan="11" class="muted" style="text-align:center;padding:20px">No matches</td></tr>`;
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=(k==="name"||k==="team")?1:-1;}
    render();
  });
  const rep = DATA.replacement[view];
  document.getElementById("foot").innerHTML =
    `Replacement level for <b>${UNIT_VIEWS[view]||view}</b>: ${rep==null?'—':rep+' pts/game'} `
    + `&nbsp;·&nbsp; Projections are a recent-form baseline (${DATA.seasons.join("–")}), recency-weighted &amp; `
    + `shrunk for sample size. VOR is vs this league's 22-team replacement. Rookies with no history are flagged, never invented.`;
}

function buildTabs(){
  const views = [["RB","RB"],["R","R (WR/TE)"],["QB","QB units"],["K","Kickers"],
                 ["DEF/ST","DEF/ST"],["C","Coaches"]];
  document.getElementById("tabs").innerHTML = views.map(([v,l])=>
    `<span class="tab ${v===view?'active':''}" data-v="${v}">${l}</span>`).join("")
    + `<input type="search" id="q" placeholder="filter name / team…">`;
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    view=t.dataset.v; sortKey= isUnit(view)?"vor":"vor"; sortDir=-1;
    buildTabs(); render();
  });
  const q=document.getElementById("q"); q.value=query;
  q.oninput=()=>{ query=q.value; render(); }; q.focus();
}

document.getElementById("sub").innerHTML =
  `${DATA.league.teams}-team league · draft ${DATA.draft_season} · `
  + `data generated ${new Date(DATA.generated_at).toLocaleString()} · `
  + `${DATA.players.length} players + team units`;
buildTabs(); render();
</script>
</body>
</html>
